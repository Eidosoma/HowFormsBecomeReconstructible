[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "writable-landlord"
version = "0.1.0"
description = "E66: the self-written landscape — canalization as mechanism"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.11"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
