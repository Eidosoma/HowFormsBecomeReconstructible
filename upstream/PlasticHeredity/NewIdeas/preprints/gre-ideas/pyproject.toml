[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gre-sim"
version = "0.1.0"
description = "Auditable gene-regulatory rehoming simulation and evolution"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numba>=0.61; python_version < '3.14'",
  "numpy>=2.1",
  "scipy>=1.14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gre-sim = "gre_sim.cli:main"
plastic-heredity-v2-campaign = "gre_sim.plastic_heredity_v2_cli:campaign_main"
plastic-heredity-v2-status = "gre_sim.plastic_heredity_v2_cli:status_main"
plastic-heredity-v2-verify = "gre_sim.plastic_heredity_v2_cli:verify_main"
plastic-heredity-v2-replay = "gre_sim.plastic_heredity_v2_cli:replay_main"
lineage-carrier-campaign = "gre_sim.lineage_carrier_cli:campaign_main"
lineage-carrier-status = "gre_sim.lineage_carrier_cli:status_main"
lineage-carrier-verify = "gre_sim.lineage_carrier_cli:verify_main"
lineage-carrier-replay = "gre_sim.lineage_carrier_cli:replay_main"
lineage-carrier-initial-replication = "gre_sim.lineage_carrier_cli:initial_replication_main"
lineage-carrier-initial-status = "gre_sim.lineage_carrier_cli:initial_status_main"
lineage-carrier-initial-verify = "gre_sim.lineage_carrier_cli:initial_verify_main"
lineage-carrier-initial-audit = "gre_sim.lineage_carrier_cli:initial_audit_main"
wagner-local-ph-campaign = "gre_sim.local_ph_cli:campaign_main"
wagner-local-ph-status = "gre_sim.local_ph_cli:status_main"
