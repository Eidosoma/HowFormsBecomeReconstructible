[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plastic-heredity-laws-confirmation"
version = "0.1.0"
description = "Independent clause-level audit tools for the Plastic Heredity LAWS programme"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
laws-confirm = "laws_confirmation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

