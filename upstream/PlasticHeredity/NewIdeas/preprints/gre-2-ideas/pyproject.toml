[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grn-reset-audit"
version = "0.1.0"
description = "Independent-start audit and washout/rechallenge assay for resettable GRN memories"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
grn-reset-audit = "grn_reset_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
